services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PORT_SEARCH_LIMIT: 0
      DATABASE_URL: sqlite:///data/woohoo.db?mode=rwc
      ASSETS_DIR: /data/assets
      UPLOAD_TMP_DIR: /data/uploads-tmp
      UPLOAD_SESSION_TTL_SECS: ${UPLOAD_SESSION_TTL_SECS:-86400}
      PROJECT_FILES_DIR: /data/project-files
      RUNTIME_MANIFEST_PATH: /data/runtime/server-info.json
      JWT_SECRET: ${JWT_SECRET:-woohoo-demo-jwt-secret-change-before-production-2026}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-72}
      RUST_ENV: ${RUST_ENV:-production}
      RUST_LOG: ${RUST_LOG:-woohoo_server=info,tower_http=info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:18080,http://localhost:18080}
    volumes:
      - woohoo-data:/data
    ports:
      - "18081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SERVER_BASE_URL: /backend
        VITE_SERVER_PORT: 8080
    depends_on:
      - server
    ports:
      - "18080:80"
    restart: unless-stopped

volumes:
  woohoo-data:
