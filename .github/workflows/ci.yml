name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    name: Server (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # 数据库迁移与测试均落在磁盘 SQLite，无需外部服务
      - run: cargo fmt --all --check
      # 存量约有 125 个 clippy 警告，先以报告形式跑，清零后改为 -D warnings
      - run: cargo clippy --all-targets
      - run: cargo test

  compose:
    name: Compose (development / demo / production config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate demo compose
        run: docker compose -f docker-compose.demo.yml config --quiet
      - name: Validate production compose
        env:
          JWT_SECRET: ci-validation-jwt-secret
          WOOHOO_API_KEY_ENCRYPTION_KEY: ci-validation-encryption-key
          CORS_ALLOWED_ORIGINS: https://ci.example.invalid
        run: docker compose -f docker-compose.production.yml config --quiet
